<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="./logo.png">
<title>Mibombo</title>
<style>
:root{--bg:#202020;--panel:#2b2b2b;--hover:#383838;--sel:#3d3d3d;--line:#3a3a3a;--text:#fff;--dim:#a0a0a0;--accent:#60cdff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.3 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.title{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel)}
.title b{font-weight:600}
.bar{display:flex;gap:8px;padding:8px 12px;background:var(--bg);align-items:center}
.btn{background:none;border:0;color:var(--text);width:32px;height:32px;border-radius:4px;font-size:16px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--hover)}.btn:disabled{color:#666;cursor:default}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-bottom-color:#555;border-radius:4px;padding:0 6px;height:32px;overflow:auto;white-space:nowrap}
.crumbs span{padding:3px 6px;border-radius:4px;cursor:pointer}.crumbs span:hover{background:var(--hover)}
.crumbs i{color:var(--dim);font-style:normal}
.search{width:240px;height:32px;background:var(--panel);border:1px solid var(--line);border-bottom-color:#555;border-radius:4px;color:var(--text);padding:0 10px;font:inherit}
.search:focus{outline:0;border-bottom-color:var(--accent)}
.main{flex:1;display:flex;min-height:0}
.nav{width:260px;background:var(--bg);overflow:auto;padding:4px 6px;flex-shrink:0}
.node{display:flex;align-items:center;gap:6px;height:32px;padding-right:8px;border-radius:4px;cursor:pointer;position:relative;white-space:nowrap}
.node:hover{background:var(--hover)}
.node.on{background:var(--sel)}.node.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.node .chev{width:16px;text-align:center;color:var(--dim);font-size:10px;transition:transform .12s}
.node .chev.open{transform:rotate(90deg)}
.node span.t{overflow:hidden;text-overflow:ellipsis}
.content{flex:1;background:var(--panel);border-radius:8px 0 0 0;border:1px solid var(--line);border-right:0;border-bottom:0;display:flex;flex-direction:column;min-width:0}
.head,.row{display:grid;grid-template-columns:minmax(160px,1fr) 150px 110px 90px 40px;align-items:center;padding:0 16px;gap:8px}
.head{height:34px;color:var(--dim);border-bottom:1px solid var(--line);font-size:13px}
.head div{cursor:pointer;padding:6px 4px;border-radius:4px}.head div:hover{background:var(--hover)}
.list{flex:1;overflow:auto;padding:4px 8px}
.row{height:36px;border-radius:4px;cursor:default;user-select:none;margin:1px 0}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.name{display:flex;align-items:center;gap:10px;overflow:hidden}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{height:26px;display:flex;align-items:center;padding:0 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--dim)}
.menu{position:fixed;background:#2c2c2c;border:1px solid #454545;border-radius:8px;padding:4px;box-shadow:0 8px 24px #0008;z-index:9;display:none;min-width:170px}
.menu div{padding:7px 12px;border-radius:4px;cursor:pointer}.menu div:hover{background:var(--hover)}
.cfg{max-width:520px;margin:60px auto;padding:20px;background:var(--panel);border-radius:8px}
svg{flex-shrink:0}
.dl{width:32px;height:32px;border:0;border-radius:4px;background:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dl:hover{background:#4a4a4a}.dl:focus-visible,.btn:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent)}
.menubtn{display:none}
.scrim{position:fixed;inset:0;background:#0008;z-index:19;display:none}.scrim.show{display:block}
.modal{position:fixed;inset:0;z-index:30;background:#1c1c1c;display:none;flex-direction:column}.modal.show{display:flex}
.mhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.mname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mbtn{background:var(--hover);color:var(--text);border:0;border-radius:4px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.mbtn:hover
